# SDD bootstrap — poker-game
context: |
  Java 17 Maven desktop app: Texas Hold'em with Swing table UI and JavaFX overlays.
  Persistence: SQLite under ~/.pokergame/. LAN host-authoritative multiplayer (TCP JSON).
  Entry: StartMenuDialog → single-player (GameController) or LAN (LanHostController / LanClientController).

strict_tdd: true

testing:
  runner: "mvn test"
  framework: JUnit 5 (Maven Surefire)
  layers:
    unit: true
    integration: true
    e2e: false
  coverage:
    available: false
    command: null
  quality:
    linter: null
    type_checker: null
    formatter: null

phase_rules:
  proposal: "Scope against docs/lan-multiplayer.md and TODO.md F-3/F-4."
  spec: "Message catalog and acceptance criteria must be testable."
  design: "Prefer extending GameController/Lan* controllers; host owns SQLite."
  tasks: "Small PR-sized tasks; UI sprites at native resolution unless specified."
  apply: "Match existing package layout; no scaling of design PNGs without approval."
  verify: "mvn compile test; manual LAN with two JVMs when touching network."
  archive: "Move completed change under openspec/changes/archive/."
